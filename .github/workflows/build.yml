name: Build emuMMC DDR200 (variantes de prueba)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (libnx, compilador, python3)
        run: |
          if [ -f /opt/devkitpro/libnx/switch_rules ]; then
            echo "libnx ya viene en la imagen, no hace falta dkp-pacman"
          else
            ok=0
            for i in 1 2 3 4 5 6; do
              if dkp-pacman -Syu --noconfirm switch-dev; then ok=1; break; fi
              echo "Intento $i fallido, reintentando en 30s..."
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "No se pudo instalar switch-dev (pkg.devkitpro.org no responde)"; exit 1; }
          fi
          apt-get update
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates python3

      - name: Compilar hactool (lo necesita el Makefile)
        run: |
          git clone --depth 1 https://github.com/SciresM/hactool /tmp/hactool
          cd /tmp/hactool
          cp config.mk.template config.mk
          make -j"$(nproc)"
          install -m 755 hactool /usr/local/bin/hactool

      - name: Preparar funcion de compilacion
        run: |
          cat > /tmp/build_variant.sh <<'EOF'
          #!/bin/bash
          # Uso: build_variant.sh <nombre>
          set -e
          export DEVKITPRO=/opt/devkitpro
          name="$1"
          rm -f emummc.kip emummc_unpacked.kip emummc.caps emummc.data emummc.kipm
          make clean || true
          make -j"$(nproc)"
          python3 tools/kip1converter.py emummc_unpacked.kip emummc.data
          cat emummc.caps emummc.data > emummc.kipm
          mkdir -p "out/$name"
          cp emummc.kip emummc.kipm "out/$name/"
          ls -l "out/$name"
          EOF
          chmod +x /tmp/build_variant.sh

      - name: "Variante 1: solo reloj DDR200 (cambio minimo)"
        run: |
          # Del repo original solo el reloj de 400 MHz (clock.c/h) y el log.
          # emummc.c se queda como en tu repo, sin el codigo de reasercion.
          BASE=https://raw.githubusercontent.com/Lightos1/emuMMC_ddr200/108f16329adf2a19dcb6d3904807880b1228ffd2
          for f in source/soc/clock.c source/soc/clock.h source/utils/log.c source/utils/log.h; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$BASE/$f" -o "$f"
            echo "Aplicado $f"
          done
          grep -q "case 400000:" source/soc/clock.c || { echo "ERROR: falta el reloj DDR200 en clock.c"; exit 1; }
          grep -q "EMUMMC_SDMMC_UHS_DDR200_SUPPORT" Makefile || { echo "ERROR: el Makefile no define EMUMMC_SDMMC_UHS_DDR200_SUPPORT"; exit 1; }
          /tmp/build_variant.sh 1-solo-reloj

      - name: "Variante 3: reloj + no cambiar al driver de FS (un solo cambio)"
        run: |
          # Igual que la 1, mas UN cambio en emummc.c: en emuMMC raw, no pasar al
          # driver de Nintendo tras la primera lectura de la SD si DDR200 esta activo.
          python3 - <<'PY'
          p = "source/emuMMC/emummc.c"
          s = open(p).read()
          old = "                first_sd_read = false;\n                if (emuMMC_ctx.EMMC_Type == emuMMC_SD_Raw)\n"
          new = "                first_sd_read = false;\n                if (emuMMC_ctx.EMMC_Type == emuMMC_SD_Raw && !nx_sd_is_ddr200())\n"
          assert s.count(old) == 1, "no se encontro el punto a modificar en emummc.c"
          open(p, "w").write(s.replace(old, new))
          PY
          grep -n "nx_sd_is_ddr200" source/emuMMC/emummc.c
          /tmp/build_variant.sh 3-sin-cambio-a-driver-FS

      - name: "Variante 5: DIAGNOSTICO (muestra el modo SD negociado y reinicia a RCM)"
        run: |
          # Parte de la variante 3 (emummc.c ya modificado) y anade una parada
          # intencionada en la primera lectura de NAND que muestra el modo SD.
          python3 - <<'PY'
          p = "source/emuMMC/emummc.c"
          s = open(p).read()
          anchor = "static void _sdmmc_ensure_device_attached(void)\n"
          assert s.count(anchor) == 1, "no se encontro el ancla 1"
          helper = (
              "// DIAGNOSTICO: reinicia a RCM mostrando en el codigo de error el modo SD negociado.\n"
              "// Codigo mostrado 2001-NNNN, NNNN = modo * 256 + velocidad (MHz).\n"
              "static void __attribute__((noreturn)) diag_abort(u32 info)\n"
              "{\n"
              "    atmosphere_fatal_error_ctx ctx;\n"
              "    memset(&ctx, 0, sizeof(ctx));\n"
              "    ctx.magic = ATMOSPHERE_REBOOT_TO_FATAL_MAGIC;\n"
              "    ctx.title_id = 0x0100000000000000;\n"
              "    ctx.error_desc = (info << 9) | 1;\n"
              "    smcCopyToIram(ATMOSPHERE_FATAL_ERROR_ADDR, &ctx, sizeof(ctx));\n"
              "    smcRebootToRcm();\n"
              "    while (true)\n"
              "        ;\n"
              "}\n\n"
          )
          s = s.replace(anchor, helper + anchor)
          old = "            // Call hekates driver.\n            if (emummc_read_write_inner(buf, sector, num_sectors, false))"
          assert s.count(old) == 1, "no se encontro el ancla 2"
          new = "            diag_abort(((nx_sd_mode_get() & 0xF) << 8) | (sd_storage.csd.busspeed & 0xFF));\n" + old
          s = s.replace(old, new)
          open(p, "w").write(s)
          PY
          grep -n "diag_abort" source/emuMMC/emummc.c
          /tmp/build_variant.sh 5-diagnostico

      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: emummc-ddr200
          path: out
          if-no-files-found: error
